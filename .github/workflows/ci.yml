name: "Code Checks"

on: [push, pull_request]

jobs:
  Build:
    name: PHP ${{ matrix.php-versions }} on ${{ matrix.operating-system }}
    runs-on: ${{ matrix.operating-system }}
    strategy:
      matrix:
        operating-system: [windows-latest, ubuntu-latest, macos-latest]
        php-versions: ['8.4']
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          tools: composer, pecl
          extensions: svm, mbstring, gd, fileinfo, swoole
          ini-values: memory_limit=-1

      - name: Install OpenBLAS
        if: matrix.operating-system == 'ubuntu-latest'
        run: |
          sudo apt-get update -q
          sudo apt-get install -qy libopenblas-dev liblapacke-dev

      - name: Install OpenBLAS/LAPACK (macOS)
        if: matrix.operating-system == 'macos-latest'
        run: |
          brew update
          brew install openblas lapack

      - name: Install NumPower
        run: |
          git clone --branch mac4 --single-branch https://github.com/RubixML/numpower.git
          cd numpower
          phpize
          if [ "${{ matrix.operating-system }}" = "macos-latest" ]; then
            export OPENBLAS_PREFIX="$(brew --prefix openblas)"
            export LAPACK_PREFIX="$(brew --prefix lapack)"
            export CPPFLAGS="-I${OPENBLAS_PREFIX}/include -I${LAPACK_PREFIX}/include"
            export LDFLAGS="-L${OPENBLAS_PREFIX}/lib -L${LAPACK_PREFIX}/lib"
            export PKG_CONFIG_PATH="${OPENBLAS_PREFIX}/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          fi
          ./configure
          make
          sudo make install
          echo "extension=ndarray.so" | sudo tee -a "$(php -i | grep \"Loaded Configuration File\" | sed -e \"s|.*=>\\s*||\")" > /dev/null

      - name: Validate composer.json
        run: composer validate

      - name: Install Dependencies
        run: composer install

      - name: Static Analysis
        run: composer analyze

      - name: Unit Tests
        run: composer test

      - name: Check Coding Style
        run: composer check
